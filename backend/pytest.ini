[pytest]
DJANGO_SETTINGS_MODULE = config.settings.test
python_files = test_*.py tests.py *_test.py
python_classes = Test*
python_functions = test_*
testpaths = apps
addopts =
    --strict-markers
    --tb=short
    --disable-warnings
    --reuse-db
    -p no:cacheprovider
markers =
    unit: fast isolated unit tests
    integration: tests that hit the database
    api: end-to-end API tests through the DRF test client
    slow: long running tests
asyncio_mode = auto
