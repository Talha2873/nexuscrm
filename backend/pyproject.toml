[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = '''
/(
  | migrations
  | \.venv
)/
'''

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["apps", "config"]
skip = ["migrations", ".venv"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["migrations", ".venv", "staticfiles"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "DJ", "SIM"]
ignore = [
    "E501",   # line length handled by black
    "B008",   # function call in default argument (DRF/Django idiom)
    "N999",   # module naming
    "DJ001",  # null=True on CharField is intentional in several models
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"config/settings/*.py" = ["F403", "F405"]
"*/tests/*.py" = ["S101"]

[tool.coverage.run]
source = ["apps"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/apps.py",
    "*/__init__.py",
    "manage.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
